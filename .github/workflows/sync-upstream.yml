name: Sync with Upstream

on:
  # Jalankan otomatis setiap hari jam 07:00 WIB (00:00 UTC)
  schedule:
    - cron: '0 0 * * *'

  # Bisa juga dijalankan manual dari tab Actions di GitHub
  workflow_dispatch:

jobs:
  sync:
    name: Sync Fork with Upstream
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          # Gunakan token dengan permission write ke repo fork ini
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/rianmubarok/cooksnap-mobile-app.git

      - name: Fetch upstream
        run: |
          git fetch upstream

      - name: Merge upstream into main
        run: |
          git checkout main
          git merge upstream/main --no-edit --allow-unrelated-histories || true

      - name: Push changes to fork
        run: |
          git push origin main
